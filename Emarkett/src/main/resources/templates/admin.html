<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 25%, #1d4ed8 50%, #2563eb 75%, #1e40af 100%);
            z-index: -2;
        }

        .background-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                    radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.8) 0%, transparent 50%),
                    radial-gradient(circle at 75% 75%, rgba(29, 78, 216, 0.8) 0%, transparent 50%),
                    radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.6) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            background: #ffffff;
        }

        .shape-1 {
            width: 180px;
            height: 180px;
            top: 10%;
            right: 5%;
            animation: float-1 15s ease-in-out infinite;
        }

        .shape-2 {
            width: 120px;
            height: 120px;
            bottom: 15%;
            left: 10%;
            animation: float-2 18s ease-in-out infinite;
        }

        .shape-3 {
            width: 90px;
            height: 90px;
            top: 60%;
            left: 5%;
            animation: float-3 12s ease-in-out infinite;
        }

        .shape-4 {
            width: 150px;
            height: 150px;
            top: 40%;
            right: 8%;
            animation: float-2 16s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        @keyframes float-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-25px, 20px) scale(1.1); }
        }

        @keyframes float-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(0.9); }
        }

        @keyframes float-3 {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
        }

        .navbar {
            background: rgba(30, 58, 138, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            color: white !important;
            font-size: 1.5rem;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 8px;
            padding: 0.5rem 1rem !important;
        }

        .nav-link:hover {
            color: white !important;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .main-container {
            position: relative;
            z-index: 1;
            padding: 2rem 0;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }

        .page-title {
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .page-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: white;
            padding: 0.875rem 1.25rem;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(147, 197, 253, 0.8);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
            color: white;
        }

        .btn-search {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            color: #1e40af;
            border: none;
            border-radius: 15px;
            padding: 0.875rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-search:hover {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .users-table-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 2rem;
        }

        .users-table {
            margin: 0;
            background: transparent;
        }

        .users-table thead {
            background: rgba(30, 58, 138, 0.9);
        }

        .users-table thead th {
            color: white;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 1.25rem 1rem;
            border: none;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .users-table tbody tr {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .users-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.01);
        }

        .users-table tbody td {
            color: white;
            padding: 1rem;
            border: none;
            font-weight: 400;
        }

        .btn-danger-custom {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 0.5rem 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }

        .btn-danger-custom:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            color: white;
        }

        .pagination-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .pagination-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            padding: 0.5rem 1rem;
            margin: 0 0.25rem;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .pagination-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .pagination-btn.active {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            color: #1e40af;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .slide-up {
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2rem;
            }

            .users-table-container {
                margin: 0 1rem;
            }

            .search-container,
            .pagination-container {
                margin: 0 1rem 2rem 1rem;
            }
        }
    </style>
</head>
<body>
<div class="background-container"></div>
<div class="floating-shape shape-1"></div>
<div class="floating-shape shape-2"></div>
<div class="floating-shape shape-3"></div>
<div class="floating-shape shape-4"></div>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="fas fa-shopping-cartController me-2"></i>
            Cart iT
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button class="nav-link" type="submit"><i class="fas fa-sign-out-alt me-1"></i>
                            Se déconnecter</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="main-container">
    <div class="container">
        <!-- Page Header -->
        <div class="page-header fade-in">
            <h1 class="page-title">All Users</h1>
            <p class="page-subtitle">Manage your community</p>
        </div>
        <!-- Logout Message -->
        <div th:if="${removed}" class="alert alert-custom alert-success alert-dismissible fade show mb-3" role="alert">
            <i class="fas fa-info-circle me-2"></i>
            <span th:text="${removed}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <!-- Search Form -->
        <div class="search-container slide-in">
            <form method="get" action="#" th:action="@{/admin}">
                <div class="input-group">
                    <input type="text"
                           class="form-control search-input"
                           name="keyword"
                           placeholder="Rechercher un utilisateur (nom, email...)"
                           th:value="${keyword}">
                    <button class="btn btn-search" type="submit">
                        <i class="fas fa-search me-1"></i>
                        Rechercher
                    </button>
                </div>
            </form>
        </div>

        <!-- Users Table -->
        <div class="users-table-container slide-up">
            <table class="table table-hover align-middle users-table">
                <thead>
                <tr>
                    <th style="color: #1e3a8a" ><i class="fas fa-user me-2"></i>Nom d'utilisateur</th>
                    <th style="color: #1e3a8a" ><i class="fas fa-lock me-2"></i>Mot de passe</th>
                    <th style="color: #1e3a8a" ><i class="fas fa-cogs me-2"></i>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${listofusers}">
                    <td>
                        <i class="fas fa-user-circle me-2" style="color: rgba(147, 197, 253, 0.8);"></i>
                        <span style="color: #1e3a8a"  th:text="${s.username}"></span>
                    </td>
                    <td class="password-cell">
                        <i class="fas fa-eye-slash me-2" style="color: rgba(147, 197, 253, 0.8);"></i>
                        <span style="color: #1e3a8a" th:text="${'•'.repeat(s.password.length())}"></span>
                    </td>
                    <td class="table-actions">
                        <form th:action="@{/user/delete/{id}(id=${s.id})}" method="post" style="display:inline;">
                            <button class="btn btn-danger-custom btn-sm"
                                    type="submit"
                                    onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')">
                                <i class="fas fa-trash-alt me-1"></i>
                                Supprimer
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-container slide-up">
            <div class="text-center">
                <div class="d-inline-flex flex-wrap justify-content-center">
                    <a class="pagination-btn me-2" th:each="p, stat : ${pages}"
                       th:href="@{/admin(page=${stat.index}, taille=4, keyword=${keyword})}"
                       th:classappend="${stat.index == currentPage} ? 'active' : ''">
                        <span th:text="${stat.index + 1}"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Parallax effect for floating shapes
        const shapes = document.querySelectorAll('.floating-shape');

        document.addEventListener('mousemove', function(e) {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 0.2;
                const x = (mouseX - 0.5) * speed * 15;
                const y = (mouseY - 0.5) * speed * 15;

                shape.style.transform += ` translate(${x}px, ${y}px)`;
            });
        });

        // Enhanced table row hover effects
        const tableRows = document.querySelectorAll('.users-table tbody tr');
        tableRows.forEach(row => {
            row.addEventListener('mouseenter', function() {
                this.style.boxShadow = '0 8px 25px rgba(59, 130, 246, 0.2)';
            });

            row.addEventListener('mouseleave', function() {
                this.style.boxShadow = 'none';
            });
        });

        // Smooth scroll animations on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationDelay = '0s';
                    entry.target.classList.add('fade-in');
                }
            });
        }, observerOptions);

        // Observe elements for animation
        document.querySelectorAll('.users-table-container, .pagination-container').forEach(el => {
            observer.observe(el);
        });

        // Add loading effect to search button
        const searchForm = document.querySelector('form');
        if (searchForm) {
            searchForm.addEventListener('submit', function() {
                const searchBtn = this.querySelector('.btn-search');
                const icon = searchBtn.querySelector('i');
                icon.className = 'fas fa-spinner fa-spin me-1';
                searchBtn.disabled = true;
            });
        }

        // Add confirmation dialog enhancement
        document.querySelectorAll('.btn-danger-custom').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();

                // Create custom confirmation dialog
                const userRow = this.closest('tr');
                const username = userRow.querySelector('td:first-child span').textContent;

                if (confirm(`⚠️ Attention!\n\nVoulez-vous vraiment supprimer l'utilisateur "${username}" ?\n\nCette action est irréversible.`)) {
                    // Add loading state
                    const icon = this.querySelector('i');
                    const originalIcon = icon.className;
                    icon.className = 'fas fa-spinner fa-spin me-1';
                    this.disabled = true;

                    // Submit the form
                    setTimeout(() => {
                        this.closest('form').submit();
                    }, 300);
                }
            });
        });

        // Table rows staggered animation
        const rows = document.querySelectorAll('.users-table tbody tr');
        rows.forEach((row, index) => {
            row.style.opacity = '0';
            row.style.transform = 'translateY(20px)';

            setTimeout(() => {
                row.style.transition = 'all 0.5s ease';
                row.style.opacity = '1';
                row.style.transform = 'translateY(0)';
            }, index * 100);
        });
    });
</script>
</body>
</html>
