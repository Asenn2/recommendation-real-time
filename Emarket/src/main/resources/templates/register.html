<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            font-family: 'Arial', sans-serif;
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 25%, #1d4ed8 50%, #2563eb 75%, #1e40af 100%);
            z-index: -2;
        }

        .background-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                    radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.8) 0%, transparent 50%),
                    radial-gradient(circle at 75% 75%, rgba(29, 78, 216, 0.8) 0%, transparent 50%),
                    radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.6) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            background: #ffffff;
        }

        .shape-1 {
            width: 250px;
            height: 250px;
            top: -125px;
            right: -125px;
            animation: float-1 15s ease-in-out infinite;
        }

        .shape-2 {
            width: 180px;
            height: 180px;
            bottom: -90px;
            left: -90px;
            animation: float-2 18s ease-in-out infinite;
        }

        .shape-3 {
            width: 120px;
            height: 120px;
            top: 30%;
            left: -60px;
            animation: float-3 12s ease-in-out infinite;
        }

        .shape-4 {
            width: 200px;
            height: 200px;
            top: 20%;
            right: -100px;
            animation: float-2 16s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        @keyframes float-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-25px, 20px) scale(1.1); }
        }

        @keyframes float-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -30px) scale(0.9); }
        }

        @keyframes float-3 {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
        }

        .register-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            padding: 2.5rem;
            margin: 2rem 0;
        }

        .user-plus-icon-container {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 auto 2rem;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .user-plus-icon-container:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
        }

        .user-plus-icon {
            color: white;
            font-size: 2.5rem;
            transition: all 0.3s ease;
        }

        .user-plus-icon-container:hover .user-plus-icon {
            transform: scale(1.1);
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: white;
            padding: 0.875rem 1rem 0.875rem 3.5rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-control-custom::placeholder {
            color: rgba(255, 255, 255, 0.75);
            text-transform: uppercase;
            font-size: 0.875rem;
            letter-spacing: 0.5px;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(147, 197, 253, 0.8);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
            color: white;
        }

        .form-control-custom.is-valid {
            border-color: rgba(34, 197, 94, 0.8);
            background: rgba(34, 197, 94, 0.1);
        }

        .form-control-custom.is-invalid {
            border-color: rgba(239, 68, 68, 0.8);
            background: rgba(239, 68, 68, 0.1);
        }

        .input-group-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.75);
            z-index: 10;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group-custom:focus-within .input-group-icon {
            color: rgba(147, 197, 253, 0.95);
            transform: translateY(-50%) scale(1.1);
        }

        .btn-register {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            color: #1e40af;
            border: none;
            border-radius: 15px;
            padding: 1rem 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-register:hover::before {
            left: 100%;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: #1d4ed8;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-register:focus {
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        .login-link {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .login-link:hover {
            color: #93c5fd;
            border-bottom-color: #93c5fd;
            transform: translateY(-1px);
        }

        .alert-custom {
            background: rgba(239, 68, 68, 0.95);
            border: none;
            border-radius: 15px;
            color: white;
            border-left: 5px solid #EF4444;
            backdrop-filter: blur(10px);
        }

        .alert-custom.alert-success {
            background: rgba(34, 197, 94, 0.95);
            border-left-color: #22C55E;
        }

        .alert-custom.alert-info {
            background: rgba(59, 130, 246, 0.95);
            border-left-color: #3B82F6;
        }

        .form-text-custom {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .password-strength {
            margin-top: 0.5rem;
        }

        .password-strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
            opacity: 0.8;
        }

        .strength-weak { background-color: #ef4444; width: 33%; }
        .strength-medium { background-color: #f59e0b; width: 66%; }
        .strength-strong { background-color: #22c55e; width: 100%; }

        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .register-card {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }

            .user-plus-icon-container {
                width: 70px;
                height: 70px;
            }

            .user-plus-icon {
                font-size: 2rem;
            }

            .form-control-custom {
                padding: 0.75rem 1rem 0.75rem 3rem;
            }
        }

        @media (max-width: 768px) {
            .register-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="background-container"></div>
<div class="floating-shape shape-1"></div>
<div class="floating-shape shape-2"></div>
<div class="floating-shape shape-3"></div>
<div class="floating-shape shape-4"></div>

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
            <div class="register-card fade-in">
                <!-- User Plus Icon -->
                <div class="user-plus-icon-container">
                    <i class="fas fa-user-plus user-plus-icon"></i>
                </div>

                <!-- Page Title -->
                <h2 class="text-center text-white mb-4" style="font-weight: 300; letter-spacing: 2px;">
                    CREATE AN ACCOUNT
                </h2>

                <!-- Registration Form -->
                <form th:action="@{/process_register}" method="post" th:object="${user}" novalidate class="slide-in">
                    <!-- Error Message -->
                    <div th:if="${error}" class="alert alert-custom alert-dismissible fade show mb-4" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${error}">An error occurred during registration !</span>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Success Message -->
                    <div th:if="${success}" class="alert alert-custom alert-success alert-dismissible fade show mb-4" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${success}">Registered successfully ! You can now get connected .</span>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Username Field -->
                    <div class="input-group-custom">
                        <i class="fas fa-user input-group-icon"></i>
                        <input type="text"
                               class="form-control form-control-custom"
                               th:field="*{username}"
                               placeholder="Username"
                               required
                               minlength="3"
                               maxlength="20"
                               autocomplete="username">
                        <div class="valid-feedback">
                            Valid username !
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group-custom">
                        <i class="fas fa-lock input-group-icon"></i>
                        <input type="password"
                               class="form-control form-control-custom"
                               th:field="*{password}"
                               placeholder="Password"
                               required
                               autocomplete="new-password"
                               id="password">
                        <div class="valid-feedback">
                            Valid password !
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                            <small class="form-text-custom" id="strengthText">
                                Use a secured password
                            </small>
                        </div>
                    </div>

                    <!-- Register Button -->
                    <div class="mb-4">
                        <button type="submit" class="btn btn-register" id="registerBtn">
                            <i class="fas fa-user-plus me-2"></i>
                            <span class="btn-text">Create an account</span>
                        </button>
                    </div>

                    <!-- Login Link -->
                    <div class="text-center">
                        <span class="text-white" style="opacity: 0.8;">Already an account ? </span>
                        <a href="#" class="login-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt me-1"></i>
                            Connect
                        </a>
                    </div>

                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Animation au survol avec parallaxe
        const shapes = document.querySelectorAll('.floating-shape');

        document.addEventListener('mousemove', function(e) {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 0.3;
                const x = (mouseX - 0.5) * speed * 25;
                const y = (mouseY - 0.5) * speed * 25;

                shape.style.transform += ` translate(${x}px, ${y}px)`;
            });
        });

        // Validation de mot de passe et force
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d/)) strength++;
            if (password.match(/[^a-zA-Z\d]/)) strength++;

            return strength;
        }

        function updatePasswordStrength() {
            const password = passwordInput.value;
            const strength = checkPasswordStrength(password);

            strengthBar.className = 'password-strength-bar';

            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Saisissez un mot de passe sécurisé';
            } else if (strength <= 1) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = 'Mot de passe faible';
            } else if (strength <= 2) {
                strengthBar.classList.add('strength-medium');
                strengthText.textContent = 'Mot de passe moyen';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = 'Mot de passe fort';
            }
        }

        passwordInput.addEventListener('input', updatePasswordStrength);

        // Validation Bootstrap
        const form = document.querySelector('form');
        const inputs = form.querySelectorAll('.form-control');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            event.stopPropagation();

            let isValid = true;

            // Validation standard
            inputs.forEach(input => {
                if (!input.checkValidity()) {
                    input.classList.add('is-invalid');
                    input.classList.remove('is-valid');
                    isValid = false;
                } else {
                    input.classList.remove('is-invalid');
                    input.classList.add('is-valid');
                }
            });

            if (isValid) {
                // Ajouter un spinner au bouton
                const submitBtn = form.querySelector('#registerBtn');
                const btnText = submitBtn.querySelector('.btn-text');
                btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Création en cours...';
                submitBtn.disabled = true;

                // Soumettre le formulaire
                setTimeout(() => {
                    form.submit();
                }, 500);
            } else {
                form.classList.add('was-validated');
            }
        });

        // Réinitialiser la validation lors de la saisie
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                if (this.checkValidity()) {
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                }
            });

            // Effet focus pour les icônes
            input.addEventListener('focus', function() {
                const icon = this.parentElement.querySelector('.input-group-icon');
                if (icon) {
                    icon.style.color = 'rgba(147, 197, 253, 0.95)';
                    icon.style.transform = 'translateY(-50%) scale(1.1)';
                }
            });

            input.addEventListener('blur', function() {
                const icon = this.parentElement.querySelector('.input-group-icon');
                if (icon) {
                    icon.style.color = 'rgba(255, 255, 255, 0.75)';
                    icon.style.transform = 'translateY(-50%) scale(1)';
                }
            });
        });

        // Auto-dismiss alerts après 6 secondes
        const alerts = document.querySelectorAll('.alert-dismissible');
        alerts.forEach(alert => {
            setTimeout(() => {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }, 6000);
        });

        // Effet de typing sur les placeholders
        const placeholders = [
            { element: document.querySelector('input[th\\:field="*{username}"]'), text: 'NOM D\'UTILISATEUR' },
            { element: document.querySelector('input[th\\:field="*{password}"]'), text: 'MOT DE PASSE' }
        ];

        placeholders.forEach(({ element, text }, index) => {
            if (element) {
                setTimeout(() => {
                    let currentText = '';
                    let i = 0;
                    const typeEffect = setInterval(() => {
                        if (i < text.length) {
                            currentText += text.charAt(i);
                            element.placeholder = currentText;
                            i++;
                        } else {
                            clearInterval(typeEffect);
                        }
                    }, 50);
                }, index * 300);
            }
        });

        // Animation d'entrée des champs
        const formGroups = document.querySelectorAll('.input-group-custom');
        formGroups.forEach((group, index) => {
            group.style.opacity = '0';
            group.style.transform = 'translateX(-30px)';

            setTimeout(() => {
                group.style.transition = 'all 0.6s ease';
                group.style.opacity = '1';
                group.style.transform = 'translateX(0)';
            }, index * 150);
        });
    });
</script>
</body>
</html>
